[project]
name = "py-calmet"
version = "1.0.0"
description = "Pure-NumPy CALMET-style diagnostic meteorological downscaling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "netCDF4>=1.6", "xarray>=2023.1", "pyproj>=3.5", "scipy>=1.10"]
wrf = ["xarray>=2023.1", "wrf-python>=1.3", "netCDF4>=1.6"]
full = ["py-calmet[dev,wrf]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_calmet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
