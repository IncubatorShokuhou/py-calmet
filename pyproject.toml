[project]
name = "py-calmet"
version = "0.1.0"
description = "Pure-NumPy CALMET-style diagnostic meteorological downscaling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "netCDF4>=1.6", "xarray>=2023.1", "pyproj>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_calmet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
